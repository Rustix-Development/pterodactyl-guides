name: Bug report
description: Something in the extension doesn't work as described.
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: Extension version
      placeholder: 1.0.0
    validations:
      required: true
  - type: input
    id: panel
    attributes:
      label: Panel version
      placeholder: 2.0.0
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Anything relevant from storage/logs/laravel.log or the browser console.
      render: text
